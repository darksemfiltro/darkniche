<meta name="description" content="__DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: dossiê técnico — trilho de índice à esquerda (desktop), barra de filtros fixa no topo, coluna de leitura ~70ch e blocos de dados largos. */
:root{
  --bg:#fbf9f8; --panel:#f2eeec; --panel-2:#e9e3e1; --ink:#1a1312; --ink-2:#4d4441; --muted:#776c68; --rule:#e2dad7;
  --accent:#b81f28; --accent-ink:#9c1620; --accent-soft:#f7e1e2;
  --ok:#0b7d37; --ok-soft:#dff1e5; --bad:#b81f28; --warn:#9a6400; --warn-soft:#fbefd5;
  --tier-s:#b81f28; --tier-a:#1c5cab; --tier-b:#5a5f66; --tier-c:#9a908c;
  --viz-surface:#fcfcfb; --viz-grid:#e6e2e0; --viz-axis:#7a706c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --h0:#eef4fd; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#256abf; --h6:#184f95;
  --h-ink-lo:#1a1312; --h-ink-hi:#ffffff; --h-ink-2:#1a1312; --h-ink-3:#1a1312; --h-ink-4:#ffffff; --h-ink-5:#ffffff; --h-ink-6:#ffffff;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --measure:70ch; --gutter:clamp(16px,4vw,40px); --radius:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110d0d; --panel:#1b1515; --panel-2:#251d1c; --ink:#f1ebe9; --ink-2:#cfc4c1; --muted:#a3958f; --rule:#2f2625;
    --accent:#ff5a5f; --accent-ink:#ff8085; --accent-soft:#3a1517;
    --ok:#3fcf73; --ok-soft:#12301d; --bad:#ff5a5f; --warn:#f0b43c; --warn-soft:#33270f;
    --tier-s:#ff5a5f; --tier-a:#6da7ec; --tier-b:#a6abb3; --tier-c:#7d736f;
    --viz-surface:#1a1a19; --viz-grid:#2e2a29; --viz-axis:#a3958f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --h0:#1b2230; --h1:#1c3352; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#9ec5f4;
    --h-ink-lo:#f1ebe9; --h-ink-hi:#0e1520; --h-ink-2:#f1ebe9; --h-ink-3:#f1ebe9; --h-ink-4:#0e1520; --h-ink-5:#0e1520; --h-ink-6:#0e1520;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110d0d; --panel:#1b1515; --panel-2:#251d1c; --ink:#f1ebe9; --ink-2:#cfc4c1; --muted:#a3958f; --rule:#2f2625;
  --accent:#ff5a5f; --accent-ink:#ff8085; --accent-soft:#3a1517;
  --ok:#3fcf73; --ok-soft:#12301d; --bad:#ff5a5f; --warn:#f0b43c; --warn-soft:#33270f;
  --tier-s:#ff5a5f; --tier-a:#6da7ec; --tier-b:#a6abb3; --tier-c:#7d736f;
  --viz-surface:#1a1a19; --viz-grid:#2e2a29; --viz-axis:#a3958f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --h0:#1b2230; --h1:#1c3352; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#9ec5f4;
  --h-ink-lo:#f1ebe9; --h-ink-hi:#0e1520; --h-ink-2:#f1ebe9; --h-ink-3:#f1ebe9; --h-ink-4:#0e1520; --h-ink-5:#0e1520; --h-ink-6:#0e1520;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
a{color:var(--accent-ink);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a.ext::after{content:"↗";font-size:.75em;margin-left:2px;opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:0 44px;max-width:1320px;margin:0 auto;padding-inline:var(--gutter);padding-block:12px 96px}
@media (min-width:1100px){.wrap{grid-template-columns:210px minmax(0,1fr)}}
nav.toc{display:none}
@media (min-width:1100px){nav.toc{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:13px}}
nav.toc .h{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc a{display:block;padding:4px 8px;border-left:2px solid var(--rule);color:var(--ink-2);text-decoration:none}
nav.toc a:hover,nav.toc a.on{border-left-color:var(--accent);color:var(--ink)}
nav.toc .n{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
main{min-width:0}
/* barra de filtros */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tog{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:3px;border:1px solid var(--rule);background:var(--bg)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar input[type=search]{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink);min-width:0;width:180px}
.bar .sp{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
section{padding-block:40px 8px;border-top:1px solid var(--rule)}
section.hero{border-top:0;padding-top:20px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.02;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:clamp(44px,8vw,96px);font-weight:900;text-transform:uppercase}
h1 .acc{color:var(--accent)}
h2{font-size:clamp(30px,4.4vw,50px);text-transform:uppercase;margin-bottom:14px}
h3{font-size:clamp(21px,2.4vw,27px);margin:28px 0 8px;text-transform:uppercase}
h4{font-family:var(--f-body);font-size:15px;font-weight:700;margin:18px 0 6px}
p,li{max-width:var(--measure)}
p{margin:0 0 14px}
ul,ol{padding-left:1.25em;margin:0 0 14px}
li{margin:4px 0}
strong{font-weight:600}
.lead{font-size:clamp(17px,1.9vw,20px);line-height:1.55;color:var(--ink-2);max-width:64ch}
.small{font-size:13.5px;color:var(--muted)}
.num,td.r{font-variant-numeric:tabular-nums}
code,.kbd{font-family:var(--f-mono);font-size:.86em;background:var(--panel);padding:1px 5px;border-radius:3px}
pre{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;overflow-x:auto}
.stamp{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--accent-ink);border:1.5px solid var(--accent);padding:3px 8px;transform:rotate(-2deg);margin-bottom:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:14px 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0 20px}
.tile{background:var(--panel);border-radius:var(--radius);padding:12px 14px;min-width:0}
.tile .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:3px}
.tile .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tile.hl{background:var(--accent-soft)} .tile.hl .v{color:var(--accent-ink)}
.findings{list-style:none;padding:0;margin:16px 0;border-top:1px solid var(--rule);counter-reset:f}
.findings li{max-width:none;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--rule);margin:0}
.findings li::before{counter-increment:f;content:counter(f,decimal-leading-zero);font-family:var(--f-mono);font-size:13px;color:var(--accent-ink);padding-top:3px}
.findings p{margin:0;max-width:76ch}
.tbl{overflow-x:auto;max-width:100%;margin:12px 0 18px;border:1px solid var(--rule);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)} th.sort[aria-sort]::after{content:" ↓";color:var(--accent-ink)} th.sort[aria-sort="ascending"]::after{content:" ↑"}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right} td.r{white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--panel) 60%,transparent)}
.bar-in{display:inline-block;height:8px;background:var(--accent);border-radius:0 2px 2px 0;vertical-align:middle;margin-right:6px}
.bar-in.b{background:var(--s1)} .bar-in.g{background:var(--ok)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.05em;padding:1px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.chip.S{color:var(--tier-s)} .chip.A{color:var(--tier-a)} .chip.B{color:var(--tier-b)} .chip.C{color:var(--tier-c)}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.mut{color:var(--muted)}
.chip.fill{background:var(--accent);border-color:var(--accent);color:#fff}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:11px 15px;border-radius:0 var(--radius) var(--radius) 0;margin:16px 0;max-width:84ch}
.note.red{border-left-color:var(--accent);background:var(--accent-soft)} .note p:last-child{margin:0}
.quote{font-size:14.5px;border-left:2px solid var(--rule);padding:2px 0 2px 13px;margin:8px 0;color:var(--ink-2);max-width:66ch}
.quote .who{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 28px;align-items:start}
.cols>*{min-width:0}
.fig{margin:14px 0 20px;max-width:100%}
.fig .cap{font-size:13px;color:var(--muted);margin-top:6px;max-width:84ch}
.chart{background:var(--viz-surface);border:1px solid var(--rule);border-radius:var(--radius);padding:10px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:560px}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--viz-axis)}
.chart .lbl{fill:var(--ink)} .chart .grid{stroke:var(--viz-grid);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;max-width:320px;opacity:0;transition:opacity .08s}
details{margin:8px 0 14px} summary{cursor:pointer;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
/* heatmap */
.hm-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}
.heat{display:grid;gap:3px;font-size:13px}
.heat .hd{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 6px}
.heat .rh{padding:6px;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.heat .rh small{color:var(--muted);font-size:11px}
.heat .cell{padding:6px 6px;border-radius:3px;font-variant-numeric:tabular-nums;line-height:1.25;cursor:pointer;min-height:42px;border:0;text-align:left;font:inherit;font-size:13px}
.heat .cell .m{font-family:var(--f-mono);font-weight:600;font-size:12px;white-space:nowrap}
.heat .cell .x{font-size:10px;opacity:.85;white-space:nowrap}
.heat .cell.lown{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(128,128,128,.25) 6px 7px)}
.heat .cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.heat .empty{background:var(--panel);color:var(--muted);border-radius:3px;padding:6px;font-size:11px;display:flex;align-items:center}
.hb0{background:var(--h0);color:var(--h-ink-lo)} .hb1{background:var(--h1);color:var(--h-ink-lo)} .hb2{background:var(--h2);color:var(--h-ink-2)}
.hb3{background:var(--h3);color:var(--h-ink-3)} .hb4{background:var(--h4);color:var(--h-ink-4)} .hb5{background:var(--h5);color:var(--h-ink-5)} .hb6{background:var(--h6);color:var(--h-ink-6)}
.ramp{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin:4px 0 8px}
.ramp .sw{min-width:52px;padding:1px 4px;border-radius:2px;text-align:center}
.detail{border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin:12px 0;background:var(--bg)}
.detail[hidden]{display:none}
.detail .x{float:right;background:none;border:1px solid var(--rule);border-radius:3px;font-family:var(--f-mono);font-size:12px;padding:2px 8px}
/* matriz de sondagens */
.mx td.st{text-align:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
/* cor + forma: existe = cheio · fraco = metade · lacuna = anel · inconclusivo = tracejado (não depende só de cor) */
.dot.inconclusivo{background:transparent;border:2px dashed var(--muted)} .dot.existe{background:var(--bad)} .dot.fraco{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border:2px solid var(--warn)} .dot.lacuna{background:transparent;border:3px solid var(--ok)}
.w-name{min-width:150px} .w-vid{min-width:190px} .nw{white-space:nowrap} .w-txt{min-width:200px}
@media (max-width:640px){.hide-sm{display:none} .w-vid{min-width:180px}}
.st a{white-space:nowrap}
.capnote{color:var(--warn);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;cursor:help}
.dot.rev{outline:2px dashed var(--ink);outline-offset:2px}
/* cards de oportunidade */
.opps{display:grid;gap:14px;margin:14px 0}
.opp{border:1px solid var(--rule);border-radius:8px;background:var(--bg);min-width:0}
.opp>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;font-family:var(--f-body);font-size:inherit;color:inherit}
.opp>summary::-webkit-details-marker{display:none}
.opp>summary h3{margin:0;font-size:clamp(20px,2.4vw,26px)}
.opp .mk{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opp .score{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right}
.opp .score b{display:block;font-family:var(--f-display);font-size:30px;color:var(--ink);font-weight:800;line-height:1}
.opp .body{padding:0 16px 16px}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;margin:4px 0 12px}
.axis{display:grid;grid-template-columns:20px 1fr 22px;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px}
.axis .t{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden} .axis .t i{display:block;height:100%;background:var(--ink-2)}
.axis.o .t i{background:var(--accent)} .axis.r .t i{background:var(--warn)}
.opp dl{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:4px 14px;margin:8px 0;font-size:14.5px}
.opp dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.opp dd{margin:0;max-width:80ch}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;padding:0;list-style:none}
.titles li{margin:0;font-weight:600;font-size:13px;background:var(--panel);border-radius:3px;padding:4px 8px;max-width:100%}
@media (max-width:560px){.opp dl{grid-template-columns:minmax(0,1fr)}.opp>summary{grid-template-columns:auto minmax(0,1fr)}.opp .score{grid-column:1/-1;text-align:left}}
/* canais / mercados */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px;margin:12px 0}
.card{background:var(--panel);border-radius:var(--radius);padding:12px 14px;min-width:0}
.card h4{margin:0 0 4px;font-size:15px}
.card .sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-bottom:6px}
.card p,.card li{font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;margin:10px 0}
.gallery figure{margin:0} .gallery img{width:100%;border-radius:4px;border:1px solid var(--rule);display:block}
.gallery figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.sw-row{display:flex;flex-wrap:wrap;gap:6px}
.sw-row div{width:58px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-2);line-height:1.25}
.sw-row div span{display:block;height:32px;border-radius:3px;margin-bottom:4px;border:1px solid var(--rule)}
.anat{display:flex;width:100%;min-width:620px;height:44px;border-radius:4px;overflow:hidden;gap:2px}
.anat div{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10.5px;color:#fff;text-align:center;line-height:1.1;padding:0 2px;overflow:hidden}
.k-gancho{background:#7a1218}.k-contrato{background:#a81c24}.k-escalada{background:#c9454b}.k-midroll{background:#5a5f66}.k-didatico{background:#1c5cab}.k-outro{background:#0b6e3a}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:12px 0 20px;counter-reset:st}
.pipe .st{background:var(--panel);border-radius:var(--radius);padding:11px 13px;min-width:0}
.pipe .st h4{margin:0 0 4px;font-size:14.5px}
.pipe .st h4::before{counter-increment:st;content:counter(st,decimal-leading-zero) "  ";font-family:var(--f-mono);font-weight:500;color:var(--accent-ink)}
.pipe .st p{font-size:13.5px;margin:0 0 6px;color:var(--ink-2)}
.pipe .st .tool{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.pipe .st.gate{background:var(--ok-soft)}
/* veredito */
.chip.vb{font-size:13px;padding:2px 10px;letter-spacing:.08em}
.chip.vb.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)} .chip.vb.warn{background:var(--warn);border-color:var(--warn);color:var(--bg)} .chip.vb.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin:14px 0}
.vcard{border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:var(--radius);padding:14px 16px;background:var(--panel);min-width:0}
.vcard.v-ok{border-left-color:var(--ok)} .vcard.v-warn{border-left-color:var(--warn)} .vcard.v-bad{border-left-color:var(--bad)}
.vcard .vhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .vcard .vsub{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vcard h3{margin:8px 0 4px;font-size:clamp(22px,2.6vw,30px)} .vcard h3 a{color:inherit;text-decoration:none} .vcard h3 a:hover{text-decoration:underline}
.vcard .mk{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin:0 0 8px} .vcard .why{margin:0 0 8px;color:var(--ink-2)} .vcard ul{margin:0 0 8px}
/* sinais do nicho */
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;margin:10px 0 6px}
.vitals>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.vitals .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vitals b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.mix{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--panel-2);margin:8px 0 4px}
.mix i{display:block;height:100%} .mix .m0{background:var(--s3)} .mix .m1{background:var(--s1)} .mix .m2{background:var(--s2)} .mix .m3{background:var(--tier-b)}
.mx0{color:var(--s3)} .mx1{color:var(--s1)} .mx2{color:var(--s2)} .mx3{color:var(--tier-b)}
dl.gl{display:grid;grid-template-columns:minmax(140px,max-content) minmax(0,1fr);gap:8px 18px;margin:12px 0}
dl.gl dt{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em} dl.gl dd{margin:0;max-width:78ch;color:var(--ink-2);font-size:14.5px}
@media (max-width:560px){dl.gl{grid-template-columns:minmax(0,1fr)}}
.empty-note{color:var(--muted);font-size:14px;font-style:italic}
@media print{
  .bar,nav.toc,#tip,.detail .x,.more{display:none!important}
  :root,:root[data-theme="dark"]{--bg:#fff;--panel:#f4f2f1;--panel-2:#e8e4e2;--ink:#111;--ink-2:#333;--muted:#555;--rule:#cfc9c6;--viz-surface:#fff;--viz-grid:#ddd;--viz-axis:#555}
  body{background:#fff;color:#111;font-size:12px}
  .wrap{display:block;max-width:none;padding:0}
  section{break-before:auto;padding-block:20px 4px}
  .opp,.vcard,.card,.tile,.detail,tr,figure{break-inside:avoid}
  .tbl,.chart{overflow:visible} .chart svg{min-width:0}
  a{color:#111;text-decoration:underline} a.ext::after{content:""}
}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
